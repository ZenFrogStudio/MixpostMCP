# Publishes relay/ to GitHub Pages. The pages there bounce OAuth callbacks from the social networks
# into the desktop app (see README, "Connecting social networks").
name: Relay pages

on:
  push:
    branches: [fix/provider-availability-single-source, main]
    paths: ['relay/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: relay
      - id: deployment
        uses: actions/deploy-pages@v4
